name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-and-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install ETL dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Verify ETL imports
        run: |
          python - <<'PY'
          import bs4
          import cryptography
          import fitz
          import pandas
          import pypdf
          import requests
          print('ETL dependency smoke test passed')
          PY

      - name: Parse all financial-report PDFs safely
        run: python etl/run_ingestion_safe.py

      - name: Parse Peconic Bay CPF financial statements
        run: python etl/parse_cpf.py

      - name: Build sharded search index
        run: python etl/build_search_index.py

      - name: Stamp freshness metadata
        run: python etl/write_meta.py

      - name: Commit regenerated source data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/financial-reports web/public/data/cpf web/public/data/search web/public/data/meta.json || true
          if git diff --cached --quiet; then
            echo "No regenerated data changes."
          else
            git commit -m "Update parsed Riverhead site data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Build static export
        working-directory: web
        run: |
          npm run build
          touch out/.nojekyll
          npm run verify

      - name: Trim heavyweight parser outputs
        working-directory: web
        run: |
          rm -rf out/data/financial-reports/documents
          rm -f out/data/financial-reports/line-item-candidates.json
          rm -f out/data/financial-reports/search-index.json
          rm -f out/data/financial-reports/citations.json
          du -sh out

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: web/out
          branch: gh-pages
          clean: true
          force: false
