name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-and-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install ETL dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Verify ETL imports and syntax
        run: |
          python -m compileall -q etl
          python - <<'PY'
          import bs4
          import cryptography
          import fitz
          import pandas
          import pypdf
          import requests
          print('ETL dependency and syntax smoke test passed')
          PY

      - name: Parse all financial-report PDFs safely
        run: python etl/run_ingestion_safe.py

      # Discovery above picks up a new Tentative, Preliminary or Supplement the
      # same day the Town posts it. These two read what it just parsed -- no
      # downloads -- so the budget-stage comparison and the department-request
      # view update on this deploy rather than waiting for the Monday ETL.
      - name: Build budget-stage comparison
        run: python etl/parse_budget_stages.py

      - name: Build budget adoption history (stage columns, 2005 on)
        run: python etl/parse_budget_adoption.py

      - name: Build department request vs Tentative
        run: python etl/parse_budget_requests.py

      - name: Parse Peconic Bay CPF financial statements
        run: python etl/parse_cpf.py

      # Build the exact generated search/freshness files that the static export
      # will publish. The scheduled ETL workflow is the canonical job that
      # commits these generated files; keeping them out of this deploy commit
      # avoids a timestamp-only push triggering an endless deploy loop.
      - name: Build sharded search index
        run: python etl/build_search_index.py

      - name: Stamp dataset freshness metadata
        run: python etl/write_meta.py

      - name: Commit parsed source data only
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The two stage files are derived from the parsed documents and are
          # deterministic, so committing them alongside cannot cause churn.
          git add web/public/data/financial-reports web/public/data/cpf \
            web/public/data/history/budget-stages.json \
            web/public/data/budget-supplement/requests-by-year.json || true
          if git diff --cached --quiet; then
            echo "No parsed source-data changes."
          else
            git commit -m "Update parsed Riverhead financial-report data"
            # Search/freshness generation above can leave tracked files modified.
            # Autostash preserves those build outputs while rebasing any parsed
            # source-data commit onto the latest main, then restores them for the
            # static export that follows.
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit

      - name: Build static export
        working-directory: web
        run: |
          npm run build
          touch out/.nojekyll
          npm run verify:output

      - name: Trim heavyweight parser outputs
        working-directory: web
        run: |
          rm -rf out/data/financial-reports/documents
          rm -f out/data/financial-reports/line-item-candidates.json
          rm -f out/data/financial-reports/search-index.json
          rm -f out/data/financial-reports/citations.json
          du -sh out

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: web/out
          branch: gh-pages
          clean: true
          force: false
