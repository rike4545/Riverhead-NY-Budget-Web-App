name: Watch for budget releases

# Discovery otherwise runs only inside a deploy or the financial-report ETL, so
# a budget posted between runs could wait up to about twelve hours. Through the
# weeks each stage is released, this checks the Town's Financial Reports page
# every 15 or 30 minutes and starts a deploy the moment a new budget document
# appears. The check itself downloads and parses nothing; see
# etl/watch_budget_release.py.
on:
  workflow_dispatch:
  schedule:
    # Tentative: presented Sept 24, filed by Sept 30, presented to the Board by
    # Oct 5 (Town Law s.106). Every 15 minutes, Sept 24 through Oct 6.
    - cron: '*/15 * 24-30 9 *'
    - cron: '*/15 * 1-6 10 *'
    # Preliminary and Adopted: hearing by the Thursday after Election Day,
    # adoption by Nov 20 (s.108, s.109). Every 30 minutes, Nov 1-21.
    - cron: '*/30 * 1-21 11 *'

permissions:
  contents: read
  actions: write

concurrency:
  group: watch-budget-release
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the discovery dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pypdf

      - name: Look for a budget document not yet parsed
        id: watch
        run: python etl/watch_budget_release.py

      - name: Parse and publish it now
        if: steps.watch.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          runs=$(gh run list --workflow deploy-pages.yml --repo "$GITHUB_REPOSITORY" --limit 20 --json status,createdAt,event)
          busy=$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")
          recent=$(jq '[.[] | select(.event == "workflow_dispatch" and (now - (.createdAt | fromdateiso8601)) < 7200)] | length' <<<"$runs")
          # A running deploy may not have seen it; the next check looks again.
          if [ "$busy" -gt 0 ]; then
            echo "A deploy is already running; the next check will look again."
            exit 0
          fi
          # A document that keeps failing to parse must not start a deploy
          # every 15 minutes. Three dispatched in two hours is the ceiling.
          if [ "$recent" -ge 3 ]; then
            echo "::warning::Three deploys were dispatched in the last two hours and the document is still unparsed; not dispatching again."
            exit 0
          fi
          gh workflow run deploy-pages.yml --ref main --repo "$GITHUB_REPOSITORY"
          echo "Deploy dispatched to parse ${{ steps.watch.outputs.count }} new budget document(s)."
