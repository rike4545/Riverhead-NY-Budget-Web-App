name: Quality Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install ETL dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Verify ETL imports and syntax
        run: |
          python -m compileall -q etl
          python etl/test_vote_packet_parser.py
          python etl/test_budget_release.py
          python etl/test_road_spending.py
          python etl/test_supplement_history.py
          # Rebuild the published budget-stage index before verifying Outlier Watch,
          # so CI checks the newest parsed Tentative/Preliminary/Adopted stage.
          python etl/parse_budget_stages.py
          # Exercise the same rolling parser used by the deploy workflow, then
          # fail CI if the newest Supplement cannot be reconciled to the stage PDF.
          python etl/parse_supplement_history.py
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("web/public/data/budget-supplement")
          current = json.loads((root / "current-lines.json").read_text())
          history = json.loads((root / "history.json").read_text())
          expected_years = sorted(int(p.stem) for p in Path("etl/data/supplements").glob("20[0-9][0-9].pdf"))
          latest = max(expected_years)
          assert current["supplementYear"] == latest, (current.get("supplementYear"), latest)
          assert history["budgetYear"] == latest, (history.get("budgetYear"), latest)
          assert current["lines"], "Newest Supplement produced no account lines"
          reconciliation = current.get("reconciliation", {})
          assert reconciliation.get("complete") is True, reconciliation
          assert abs(float(reconciliation.get("gap", 1e99))) <= 0.01, reconciliation
          assert not reconciliation.get("fundsOff"), reconciliation
          print(f"Supplement {latest}: {len(current['lines'])} lines; reconciliation gap {reconciliation['gap']}; passed")
          PY
          python etl/test_meeting_records.py
          python etl/test_salary_names.py
          python etl/test_fiscal_impact.py
          python etl/test_transcribe_meetings.py
          python etl/test_push_data.py
          python etl/test_pdf_limits.py
          python - <<'PY'
          import bs4
          import cryptography
          import fitz
          import pandas
          import pypdf
          import requests
          print('ETL dependency, syntax, and vote-packet parser smoke tests passed')
          PY

      - name: Rebuild search and freshness metadata
        run: |
          python etl/build_search_index.py
          python etl/write_meta.py

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Verify external authority sources
        working-directory: web
        run: npm run verify:authorities

      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit

      - name: Build static export
        working-directory: web
        run: npm run build

      - name: Verify routes, evidence contracts, and generated data
        working-directory: web
        run: npm run verify:output
