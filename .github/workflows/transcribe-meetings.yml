name: Transcribe Town Board Meetings

# Machine transcripts of the Town's own meeting videos, and the moment each
# resolution is voted, for the vote links on /meetings/ and /fiscal-impact/.
# Newest meetings first; each run also works back through a few older ones.
# See etl/transcribe_meetings.py.

on:
  workflow_dispatch:
    inputs:
      max:
        description: 'Most meetings to transcribe this run'
        default: '3'
      date:
        description: 'One meeting date (YYYY-MM-DD), redone even if it has a transcript'
        default: ''
  schedule:
    # The Town posts a meeting's video the next morning; this runs after the
    # morning meeting sync has picked it up.
    - cron: '7 14 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: transcribe-town-board-meetings
  cancel-in-progress: false

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install ETL and transcription dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[transcribe]"

      - name: Cache the Whisper model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: whisper-small.en-faster-whisper-1.2.1

      - name: Refresh the list of meeting videos
        run: python etl/build_meeting_media.py

      - name: Transcribe meetings
        env:
          MAX: ${{ github.event.inputs.max || '3' }}
          DATE: ${{ github.event.inputs.date || '' }}
        run: |
          if [ -n "$DATE" ]; then
            python etl/transcribe_meetings.py --date "$DATE" --force
          else
            python etl/transcribe_meetings.py --max "$MAX"
          fi

      - name: Find the votes again in every saved transcript
        # A meeting's resolutions can change after it is transcribed (the
        # agenda docket gives way to the adopted record), and the matching
        # improves; neither needs the audio again.
        run: python etl/transcribe_meetings.py --revote

      - name: Check the transcripts
        run: python etl/test_transcribe_meetings.py

      - name: Commit transcripts and vote times
        id: commit
        if: github.ref == 'refs/heads/main'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/transcripts
          if git diff --cached --quiet; then
            echo "No new transcripts or vote times."
            exit 0
          fi
          git commit -m "Update Town Board meeting transcripts and vote times"
          # The meeting sync may have pushed meanwhile. Transcripts are new
          # files and rebase cleanly; the links file refreshed above is set
          # aside and rebuilt on top of whatever main now holds.
          git checkout -- web/public/data/meetings/media.json
          git pull --rebase origin main
          python etl/build_meeting_media.py
          git add web/public/data/meetings/media.json
          git diff --cached --quiet || git commit -m "Link meeting votes to their moment in the video"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Feature-branch validation notice
        if: github.ref != 'refs/heads/main'
        run: echo "Transcripts were made and checked, but publishing is restricted to main."

      - name: Redeploy with the new transcripts
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main --repo "$GITHUB_REPOSITORY"
