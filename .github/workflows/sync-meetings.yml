name: Sync Town Board Meetings

on:
  workflow_dispatch:
  schedule:
    # Morning refresh plus an evening pass after typical Town Board meetings.
    - cron: '30 12,23 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-town-board-meetings
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install ETL dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Fetch current meeting records and schedule
        run: |
          python etl/fetch_meetings.py
          python etl/fetch_upcoming.py
          python etl/parse_meetings.py

      - name: Detect meeting-data changes
        id: meeting_changes
        run: |
          git add etl/data/meetings web/public/data/meetings || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No meeting-data changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild dependent search and freshness data
        if: steps.meeting_changes.outputs.changed == 'true'
        run: |
          python etl/build_search_index.py
          python etl/write_meta.py
          git add web/public/data/search web/public/data/meta.json || true

      - name: Commit refreshed meeting data
        id: commit
        if: steps.meeting_changes.outputs.changed == 'true'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Town Board meeting records"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Redeploy with current meeting data
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main --repo "$GITHUB_REPOSITORY"
