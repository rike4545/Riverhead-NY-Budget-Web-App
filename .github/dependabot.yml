version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      github-actions-updates:
        patterns: ["*"]
  - package-ecosystem: "pip"
    directory: "/etl"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      pip-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      npm-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
