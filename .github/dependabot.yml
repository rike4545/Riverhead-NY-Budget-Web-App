version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      github-actions-updates:
        patterns: ["*"]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      pip-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Major upgrades need a deliberate migration; propose them by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      npm-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Major upgrades need a deliberate migration; propose them by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
