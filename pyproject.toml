[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "riverhead-budget-etl"
version = "0.1.0"
description = "ETL dependency manifest for Riverhead Budget Live"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "cryptography>=42.0.0",
    "pypdf>=5.0.0",
    "PyMuPDF>=1.24",
    "requests>=2.32.0",
    "pandas>=2.2.0",
]

# This repository contains ETL scripts plus a web app and Supabase assets; it is
# not distributed as a Python package. Explicitly disable package discovery so
# `pip install -e .` installs the canonical dependency set without setuptools
# mistaking those top-level directories for Python packages.
[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "C4", "UP", "SIM", "PL", "RUF"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
